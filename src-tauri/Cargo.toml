[package]
name = "app"
version = "1.2.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Cargo's defaults leave the desktop binary much larger than it needs to be.
# This only affects binary size — the frontend is where the app spends its time.
# `panic` is left at "unwind" deliberately; Tauri plugins expect it.
[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
# skibi-core is private: locally git's credential manager fetches it, CI rewrites the URL to SSH with a deploy key.
tauri-plugin-skibi = { git = "https://github.com/Shaiyon69/skibi-core", tag = "v0.1.0" }
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
