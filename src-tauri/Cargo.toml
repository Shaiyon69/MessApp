[package]
name = "app"
version = "1.5.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Cargo's defaults leave the desktop binary much larger than it needs to be.
# This only affects binary size — the frontend is where the app spends its time.
# `panic` is left at "unwind" deliberately; Tauri plugins expect it.
[profile.release]
lto = true
codegen-units = 1
strip = true
# Size over speed (from Pake): the Rust side is only keys, crypto and notifications.
opt-level = "s"

# From Pake: no debug info for dependencies keeps dev builds and target/ much smaller.
[profile.dev.package."*"]
debug = false

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2"
# shaiyon-core is private: locally git's credential manager fetches it, CI rewrites the URL to SSH with a deploy key.
tauri-plugin-shaiyon = { git = "https://github.com/Shaiyon69/shaiyon-core", tag = "v0.3.0" }
tauri-plugin-notification = "2.8"
tauri-plugin-deep-link = "2"

[target.'cfg(target_os = "android")'.dependencies]
# Native FCM push; its Kotlin side is plugins/messapp-push/android.
tauri-plugin-messapp-push = { path = "plugins/messapp-push" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2.14"
