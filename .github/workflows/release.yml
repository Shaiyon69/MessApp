name: Build and deploy MessApp

on:
  workflow_dispatch:

concurrency:
  group: messapp-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Read release version
        id: version
        shell: bash
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: npm run lint

  desktop:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-22.04
            target: linux
          - platform: Windows
            os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SKIBI_CORE_SSH_KEY }}
      - name: Fetch private shaiyon-core over SSH
        shell: bash
        run: git config --global url."git@github.com:Shaiyon69/shaiyon-core".insteadOf "https://github.com/Shaiyon69/shaiyon-core"
      - uses: dtolnay/rust-toolchain@stable
      # From Pake: mold links the release binary much faster than the default ld.
      - name: Set up mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify application configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
      - name: Build native package
        shell: bash
        run: bash ./build_all.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: messapp-${{ matrix.target }}-v${{ needs.validate.outputs.version }}
          path: APPLICATIONS/MessApp-${{ matrix.platform }}-v${{ needs.validate.outputs.version }}.*
          if-no-files-found: error

  android:
    name: Build Android
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # The one Messapp release key (android/messapp-release.jks), so each APK installs over the last.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # SHA-256 of that key's certificate. An APK signed with anything else fails the release.
      ANDROID_CERT_SHA256: 0c31820980fd0aa21c3d57e2caf94b9481de7159e37cbac6336d1b3c02106874
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - name: Verify application configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$GOOGLE_SERVICES_JSON"
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::Set the $name secret (see android/keystore.properties)"; exit 1; }
          done
      - name: Restore Firebase application configuration
        shell: bash
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Restore the release signing key
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/messapp-release.jks
          {
            echo "storeFile=messapp-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties
      - name: Build Android package
        run: bash ./build_all.sh android
      - name: Check the APK is signed with the release key
        shell: bash
        run: |
          apk="APPLICATIONS/MessApp-Android-v${{ needs.validate.outputs.version }}.apk"
          signer="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          certs="$("$signer" verify --print-certs "$apk")"
          echo "$certs"
          # Newer apksigner names signers by SDK range ("Signer (minSdkVersion=...)") instead of "Signer #1".
          digest="$(printf '%s\n' "$certs" | sed -n 's/^Signer.* certificate SHA-256 digest: //p' | head -1)"
          test "$digest" = "$ANDROID_CERT_SHA256" || { echo "::error::APK signed with $digest, expected $ANDROID_CERT_SHA256"; exit 1; }
      - name: Remove the signing key from the runner
        if: always()
        shell: bash
        run: rm -f android/messapp-release.jks android/keystore.properties
      - uses: actions/upload-artifact@v7
        with:
          name: messapp-android-v${{ needs.validate.outputs.version }}
          path: APPLICATIONS/MessApp-Android-v${{ needs.validate.outputs.version }}.apk
          if-no-files-found: error

  # Binaries ship only from the Skibidevs website: the release goes to Shaiyon69/Skibidevs, never to this repo.
  # SKIBIDEVS_TOKEN: fine-grained token with Contents read/write on Shaiyon69/Skibidevs only.
  release:
    name: Publish to Skibidevs
    if: github.ref == 'refs/heads/main'
    needs:
      - validate
      - desktop
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.SKIBIDEVS_TOKEN }}
      SITE_REPO: Shaiyon69/Skibidevs
      TAG: messapp-v${{ needs.validate.outputs.version }}
    steps:
      - name: Check release token
        run: test -n "$GH_TOKEN" || { echo "::error::Set the SKIBIDEVS_TOKEN secret"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          pattern: messapp-*
          path: release-artifacts
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          path: source
      - name: Build updater manifest
        run: node source/scripts/updater-manifest.mjs release-artifacts "${{ needs.validate.outputs.version }}" > release-artifacts/latest.json
      - name: Publish Skibidevs release
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$SITE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber --repo "$SITE_REPO"
          else
            gh release create "$TAG" release-artifacts/* --title "Messapp v${{ needs.validate.outputs.version }}" --notes "Messapp v${{ needs.validate.outputs.version }}" --repo "$SITE_REPO"
          fi
      # The site refreshes its download list and updater manifests on this event.
      - name: Tell Skibidevs to refresh
        run: gh api "repos/$SITE_REPO/dispatches" -f event_type=app-released
