name: Build and deploy MessApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: messapp-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Read release version
        id: version
        shell: bash
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: npm run lint

  web:
    name: Build web application
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      VITE_BASE_PATH: /MessApp/
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Verify web configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
      - run: bash ./build_all.sh web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-web:
    name: Deploy web application
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  desktop:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-22.04
            target: linux
          - platform: Windows
            os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify application configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
      - name: Build native package
        shell: bash
        run: bash ./build_all.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: messapp-${{ matrix.target }}-v${{ needs.validate.outputs.version }}
          path: APPLICATIONS/MessApp-${{ matrix.platform }}-v${{ needs.validate.outputs.version }}.*
          if-no-files-found: error

  android:
    name: Build Android
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - name: Verify application configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$GOOGLE_SERVICES_JSON"
      - name: Restore Firebase application configuration
        shell: bash
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Build Android package
        run: bash ./build_all.sh android
      - uses: actions/upload-artifact@v7
        with:
          name: messapp-android-v${{ needs.validate.outputs.version }}
          path: APPLICATIONS/MessApp-Android-v${{ needs.validate.outputs.version }}.apk
          if-no-files-found: error

  release:
    name: Publish native applications
    if: github.ref == 'refs/heads/main'
    needs:
      - validate
      - desktop
      - android
      - deploy-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: messapp-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: MessApp_v${{ needs.validate.outputs.version }}-Beta
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-artifacts/* \
              --generate-notes \
              --prerelease \
              --title "$TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
